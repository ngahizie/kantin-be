name: CI

# Gerbang mutu per-PR (issue #141).
# WORKFLOW.md §4: "CI harus hijau" — workflow ini yang menegakkannya di GitHub,
# karena Jenkinsfile hanya build & deploy (tanpa stage test).
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Pindai ulang tiap Senin 03:00 UTC (issue #440): CVE baru terbit tanpa ada
  # commit baru, jadi gate supply chain tidak boleh hanya jalan saat ada PR.
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:

# Batalkan run lama bila branch yang sama di-push ulang.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Trivy memakai DB kerentanan sendiri (tanpa token); cukup baca repo.
permissions:
  contents: read

# Action pihak ketiga dipatok ke commit SHA (bukan tag mutable) — bagian dari
# pengurangan risiko supply chain (OWASP A03). Komentar `# vX` menyimpan tag
# asalnya supaya update tetap mudah dilacak.
env:
  # Dipatok (bukan `latest`) supaya hasil pindai reproducible antar-build.
  TRIVY_VERSION: v0.76.2
  # Gate: gagal bila ada CVE HIGH/CRITICAL yang SUDAH ada perbaikannya.
  # `--ignore-unfixed` dipakai karena base image alpine/JDK sering membawa CVE
  # tanpa patch — tanpa flag ini gate selalu merah lalu diabaikan orang.
  TRIVY_SEVERITY: HIGH,CRITICAL

jobs:
  test:
    name: Build & Test (JDK 25)
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      # JDK 25 — WAJIB (AGENTS.md §2, CONVENTIONS.md §11: bukan 21/26).
      - name: Set up JDK 25
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Tampilkan versi toolchain
        run: ./mvnw --version

      # `verify` menjalankan unit test (Surefire, *Test) DAN integration test
      # (Failsafe, *IT) berbasis Testcontainers. Runner ubuntu GitHub sudah
      # menyediakan Docker, jadi IT ledger/race-condition benar-benar dijalankan.
      - name: Build & Test
        run: ./mvnw -B -ntp verify

      - name: Unggah laporan test
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: laporan-test
          path: |
            target/surefire-reports/
            target/failsafe-reports/
          if-no-files-found: ignore
          retention-days: 7

      # Laporan cakupan JaCoCo (issue #174) — HTML + XML + CSV.
      - name: Unggah laporan cakupan (JaCoCo)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: laporan-coverage
          path: target/site/jacoco/
          if-no-files-found: ignore
          retention-days: 7

  # ── Pemeriksaan migrasi (issue #436) ────────────────────────────────────
  # Migrasi dijalankan otomatis saat aplikasi start, jadi kesalahan berkas
  # migrasi baru ketahuan setelah deploy. Job ini menjalankan `flyway:info`
  # terhadap PostgreSQL sekali pakai: berkas yang rusak / tidak terbaca /
  # tidak berurutan gagal di sini, sebelum menyentuh database nyata.
  migrasi:
    name: Flyway info (status migrasi)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: kantin_db
          POSTGRES_USER: kantin
          POSTGRES_PASSWORD: kantin
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kantin"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up JDK 25
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Flyway info (deteksi drift sebelum migrate)
        run: |
          ./mvnw -B -ntp flyway:info \
            -Dflyway.url=jdbc:postgresql://localhost:5432/kantin_db \
            -Dflyway.user=kantin \
            -Dflyway.password=kantin

  # ── Gerbang supply chain: SBOM + pindai dependency (issue #440) ───────────
  # OWASP A03:2025 (Software Supply Chain Failures). Versi dependency dikelola
  # Spring Boot BOM, tetapi CVE pada dependency transitif tidak terlihat tanpa
  # pemindaian. SBOM CycloneDX dipakai sebagai sumber pindai supaya yang
  # diperiksa adalah dependency hasil resolusi Maven, bukan tebakan dari pom.xml.
  supply-chain:
    name: SBOM & pindai dependency (Trivy)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up JDK 25
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      # Cukup goal plugin-nya (tanpa compile/package) supaya job ini cepat;
      # isi SBOM sama dengan yang dihasilkan `./mvnw verify`.
      - name: Buat SBOM CycloneDX
        run: ./mvnw -B -ntp -DskipTests org.cyclonedx:cyclonedx-maven-plugin:2.9.1:makeAggregateBom

      - name: Pasang Trivy
        uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          version: ${{ env.TRIVY_VERSION }}
          cache: true

      # Gagal (exit 1) bila ada CVE HIGH/CRITICAL yang sudah ada perbaikannya
      # DAN tidak tercatat di baseline .trivyignore.yaml. Baseline = keputusan
      # "stack tetap" (AGENTS.md §2 + ADR-0001: versi TIDAK dinaikkan), bukan
      # rencana upgrade. `--show-suppressed` menjaga daftar utang tetap tampil.
      # `set -o pipefail` wajib: tanpa itu status `trivy` tertelan `tee` dan
      # gate-nya diam-diam lolos.
      - name: Pindai dependency (gate)
        run: |
          set -o pipefail
          trivy sbom target/bom.json \
            --scanners vuln \
            --severity "$TRIVY_SEVERITY" \
            --ignore-unfixed \
            --ignorefile .trivyignore.yaml \
            --show-suppressed \
            --exit-code 1 \
            --format table | tee laporan-trivy-dependency.txt

      # Ringkasan di halaman run/PR supaya hasil terlihat tanpa membuka log.
      - name: Tulis ringkasan pindai
        if: always()
        run: |
          {
            echo "## SBOM & pindai dependency (Trivy)"
            echo
            echo "- SBOM: \`target/bom.json\` (CycloneDX, artefak \`sbom-dependency\`)"
            echo "- Ambang gate: \`$TRIVY_SEVERITY\`, CVE tanpa perbaikan diabaikan"
            echo
            echo '\`\`\`'
            cat laporan-trivy-dependency.txt 2>/dev/null || echo "(laporan tidak dihasilkan)"
            echo '\`\`\`'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Unggah SBOM & laporan pindai dependency
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sbom-dependency
          path: |
            target/bom.json
            laporan-trivy-dependency.txt
          if-no-files-found: ignore
          retention-days: 30

  # ── Gerbang image produksi (issue #215) ──────────────────────────────────
  # Unit/IT di job `test` berjalan di JVM runner (PUNYA font) sehingga TIDAK
  # menangkap bug "font hilang di container" (ekspor Excel → 500). Job ini
  # membangun image produksi lalu memverifikasi font tersedia di dalamnya.
  image:
    name: Verifikasi image produksi (font ekspor)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Build image produksi
        run: docker build -t kantin-be:ci .

      # Guard #215: Apache POI butuh font untuk ekspor Excel. Bila font hilang,
      # endpoint /api/laporan/ekspor balas 500 ("Fontconfig head is null").
      - name: Pastikan font tersedia di image (guard #215)
        run: |
          docker run --rm --entrypoint sh kantin-be:ci -c '
            set -e
            test -d /usr/share/fonts/dejavu || { echo "FONT DEJAVU HILANG"; exit 1; }
            ls /usr/lib/libfontconfig.so.1 >/dev/null 2>&1 || { echo "FONTCONFIG HILANG"; exit 1; }
            echo "OK: font + fontconfig tersedia di image produksi"
          '

      - name: Pasang Trivy
        uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          version: ${{ env.TRIVY_VERSION }}
          cache: true

      # SBOM image (paket OS + jar aplikasi) — diarsipkan per build.
      - name: Buat SBOM image (CycloneDX)
        run: trivy image --scanners vuln --format cyclonedx --output sbom-image.cdx.json kantin-be:ci

      # Gate: image dengan CVE HIGH/CRITICAL yang sudah ada patch tidak boleh
      # dipakai rilis (di Jenkins stage ini berada sebelum `docker push`).
      # Baseline yang sama dipakai untuk dependency (lihat .trivyignore.yaml).
      - name: Pindai image (gate)
        run: |
          set -o pipefail
          trivy image \
            --scanners vuln \
            --severity "$TRIVY_SEVERITY" \
            --ignore-unfixed \
            --ignorefile .trivyignore.yaml \
            --show-suppressed \
            --exit-code 1 \
            --format table kantin-be:ci | tee laporan-trivy-image.txt

      - name: Tulis ringkasan pindai image
        if: always()
        run: |
          {
            echo "## Pindai image produksi (Trivy)"
            echo
            echo "- SBOM image: \`sbom-image.cdx.json\` (artefak \`sbom-image\`)"
            echo "- Ambang gate: \`$TRIVY_SEVERITY\`, CVE tanpa perbaikan diabaikan"
            echo
            echo '\`\`\`'
            cat laporan-trivy-image.txt 2>/dev/null || echo "(laporan tidak dihasilkan)"
            echo '\`\`\`'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Unggah SBOM & laporan pindai image
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sbom-image
          path: |
            sbom-image.cdx.json
            laporan-trivy-image.txt
          if-no-files-found: ignore
          retention-days: 30
