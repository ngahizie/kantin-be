# .trivyignore.yaml — baseline temuan yang disengaja (issue #440)
#
# Gate supply chain (CI job `supply-chain` + job `image`, Jenkins stage
# `Pindai Supply Chain`) memakai file ini lewat `--ignorefile`. Gate GAGAL bila
# ada CVE HIGH/CRITICAL yang tidak ada di daftar ini (dan sudah ada patch-nya).
#
# Isi file = utang keamanan yang sudah ada SEBELUM gate ini dipakai, bukan
# pengecualian permanen. Semua entri kedaluwarsa 2027-12-31; setelah tanggal itu
# Trivy menolak baseline-nya dan gate merah.
#
# Tech stack TIDAK diubah: architecture/AGENTS.md §2 mematok Spring Boot 4.0.2
# (ADR-0001, parity admin-be). Baseline ini adalah cara gate tetap aktif tanpa
# melanggar §2 — bukan alasan untuk menaikkan versi, dan tidak ada rencana
# menaikkan versi. Tinjau ulang setiap rilis; perpanjangan `expired_at` wajib
# disertai persetujuan tertulis (nama + tanggal) di deskripsi PR.
#
# ATURAN: setiap entri WAJIB memuat (a) alasan/keputusan, (b) tanggal kedaluwarsa,
# dan (c) nomor issue rujukan (mis. "#440"). Entri tanpa salah satunya dicabut
# saat review. Kalau sebuah CVE bisa diperbaiki sekarang, PERBAIKI — jangan
# tambahkan ke sini.
#
# Format: https://trivy.dev/latest/docs/configuration/filtering/#trivyignoreyaml
